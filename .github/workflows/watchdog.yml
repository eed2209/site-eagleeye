name: Surveillance du serveur

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Contrôler le site et l'outil de RDV
        id: probe
        continue-on-error: true
        run: |
          # Etape 1 : 3 tentatives espacées de 10 s depuis GitHub (IPv4 forcé).
          # Etape 2 : si échec, CONTRE-VERIFICATION depuis des points de contrôle
          # indépendants (check-host.net). L'alerte ne part que si la panne est
          # confirmée : le réseau de GitHub est trop capricieux pour être cru seul.
          probe_one() {
            local url="$1" http rc
            http=$(curl -4 -s -o /dev/null -m 25 --retry 2 --retry-delay 10 --retry-all-errors -w '%{http_code}' "$url"); rc=$?
            if [ "$rc" -eq 0 ] && [ "$http" -ge 200 ] && [ "$http" -lt 400 ]; then echo "OK"; return 0; fi
            case "$rc" in
              6)  echo "nom de domaine introuvable (problème DNS)";;
              7)  echo "connexion refusée : la machine répond mais ce service est arrêté";;
              28) echo "aucune réponse : serveur éteint ou injoignable";;
              35|53|58|60) echo "problème de certificat HTTPS";;
              0)  echo "erreur HTTP $http : le serveur web tourne mais l'application est en panne";;
              *)  echo "erreur réseau (code technique $rc)";;
            esac
            return 1
          }
          # Retourne 0 UNIQUEMENT si la panne est positivement confirmée par les
          # points externes. Dans tous les autres cas (vérificateur injoignable,
          # limite de débit, réponse incomplète) : pas d'alerte — le contrôle
          # suivant, 10 minutes plus tard, retentera. Une alerte envoyée = une
          # panne réellement constatée depuis l'extérieur, jamais un doute.
          confirm_down() {
            local url="$1" rid res
            for a in 1 2 3; do
              rid=$(curl -s -m 20 -H "Accept: application/json" "https://check-host.net/check-http?host=${url}&max_nodes=3" | jq -r '.request_id // empty')
              [ -n "$rid" ] && break
              sleep 10
            done
            if [ -z "$rid" ]; then
              echo "Contre-vérification indisponible pour ${url} : pas d'alerte (prochain contrôle dans 10 min)" >&2
              return 1
            fi
            for i in 1 2 3 4 5 6 7 8; do
              sleep 8
              res=$(curl -s -m 20 -H "Accept: application/json" "https://check-host.net/check-result/${rid}")
              echo "check-host ${url} (lecture $i) : ${res}" >&2
              if echo "$res" | jq -e '[.[] | select(. != null) | .[0][0]] | any(. == 1)' >/dev/null 2>&1; then
                return 1
              fi
              if echo "$res" | jq -e 'length > 0 and ([.[]] | all(. != null))' >/dev/null 2>&1; then
                return 0
              fi
            done
            echo "Contre-vérification restée incomplète pour ${url} : pas d'alerte" >&2
            return 1
          }
          fail=""
          site_diag=$(probe_one https://srv1864501.hstgr.cloud/) || fail="le site"
          rdv_diag=$(probe_one https://srv1864501.hstgr.cloud:3443/api/public/config) || fail="${fail:+$fail et }l'outil de RDV"
          if [ -n "$fail" ]; then
            confirmed=""
            if [ "$site_diag" != "OK" ] && confirm_down "https://srv1864501.hstgr.cloud/"; then confirmed="oui"; fi
            if [ -z "$confirmed" ] && [ "$rdv_diag" != "OK" ] && confirm_down "https://srv1864501.hstgr.cloud:3443/api/public/config"; then confirmed="oui"; fi
            if [ -z "$confirmed" ]; then
              echo "Echec depuis GitHub mais le serveur répond depuis les points de contrôle externes : fausse alerte réseau, aucun email envoyé."
              fail=""
              site_diag="OK (joignable depuis les points de contrôle externes)"
              rdv_diag="OK (joignable depuis les points de contrôle externes)"
            fi
          fi
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          echo "site_diag=$site_diag" >> "$GITHUB_OUTPUT"
          echo "rdv_diag=$rdv_diag" >> "$GITHUB_OUTPUT"
          [ -z "$fail" ]

      - name: Lire le résultat du contrôle précédent
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/watchdog.yml/runs?per_page=1&status=completed" --jq '.workflow_runs[0].conclusion' 2>/dev/null || echo "unknown")
          echo "conclusion=$prev" >> "$GITHUB_OUTPUT"

      - name: Alerte de panne (uniquement au moment où ça tombe)
        if: steps.probe.outcome == 'failure' && steps.prev.outputs.conclusion != 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.WATCHDOG_SMTP_USER }}
          password: ${{ secrets.WATCHDOG_SMTP_PASS }}
          from: Surveillance EED <contact@eagleeye.digital>
          to: karen.monniaers@eagleeye.digital,karenmonniaers@gmail.com
          subject: "🚨 ALERTE : ${{ steps.probe.outputs.fail }} ne répond plus"
          body: |
            Le contrôle automatique vient d'échouer : ${{ steps.probe.outputs.fail }} ne répond plus.

            Cette panne est CONFIRMÉE : elle a été vérifiée depuis plusieurs points de contrôle indépendants dans le monde avant de vous alerter. Ce n'est pas une fausse alerte réseau.

            Diagnostic automatique :
            - Site vitrine : ${{ steps.probe.outputs.site_diag }}
            - Outil de RDV : ${{ steps.probe.outputs.rdv_diag }}

            Comment réagir selon le diagnostic :
            - « aucune réponse » sur les deux → le serveur est probablement éteint ou bloqué : hpanel.hostinger.com → VPS → Redémarrer.
            - « connexion refusée » ou « erreur HTTP » sur l'outil de RDV uniquement → l'application a planté ; un redémarrage du serveur via Hostinger la relance aussi.
            - « problème de certificat HTTPS » → le site reste joignable en tapant son adresse en http, prévenez Claude pour renouveler le certificat.
            - « problème DNS » → souci de nom de domaine, à vérifier dans le panneau Hostinger.

            Liens directs :
            1. Le site : https://srv1864501.hstgr.cloud
            2. L'outil de RDV : https://srv1864501.hstgr.cloud:3443
            3. Panneau Hostinger : https://hpanel.hostinger.com

            Un email de confirmation sera envoyé automatiquement au retour en ligne.

      - name: Retour en ligne (après une panne)
        if: steps.probe.outcome == 'success' && steps.prev.outputs.conclusion == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.WATCHDOG_SMTP_USER }}
          password: ${{ secrets.WATCHDOG_SMTP_PASS }}
          from: Surveillance EED <contact@eagleeye.digital>
          to: karen.monniaers@eagleeye.digital,karenmonniaers@gmail.com
          subject: "✅ Retour en ligne : tout répond de nouveau"
          body: |
            Le site et l'outil de RDV répondent de nouveau normalement.

      - name: Statut final du contrôle
        if: steps.probe.outcome == 'failure'
        run: exit 1
