# ==========================================================================
# Sveltia CMS — board d'édition des articles du blog Eagle Eye Digital.
#
# Enregistrer un article dans le board crée un commit sur
# eed2209/site-eagleeye (branche main), ce qui déclenche l'auto-déploiement.
# Aucun code à toucher : on remplit les champs, on enregistre, c'est en ligne.
# ==========================================================================

backend:
  name: github
  repo: eed2209/site-eagleeye
  branch: main
  # Relais d'authentification GitHub : service Node (pm2 "eed-oauth") sur le VPS,
  # exposé par nginx. Endpoints : /oauth/auth et /oauth/callback.
  base_url: https://eagleeye.digital/oauth

# Permet d'éditer en local (sur http://localhost) sans passer par GitHub, via
# `npx @sveltia/cms-proxy-server`. Sans aucun effet en production.
local_backend: true

# Interface en français.
locale: fr

# URL du site en production : active le lien « voir en ligne » depuis le board.
site_url: https://eagleeye.digital
display_url: https://eagleeye.digital

# Les images uploadées depuis le board atterrissent dans public/images,
# et sont référencées dans les articles par /images/...
media_folder: "public/images"
public_folder: "/images"

collections:
  - name: blog
    label: "Articles de blog"
    label_singular: "Article"
    description: "Les articles du cocon SEO. Un article = un mot-clé = un lien vers sa page pilier."
    folder: "src/content/blog"
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}"
    # Affiche le statut devant chaque titre dans la liste du board :
    # 🟠 BROUILLON pour les non publiés, ✅ pour les publiés.
    summary: "{{fields.draft | ternary('🟠 BROUILLON — ','✅ ')}}{{fields.date | date('DD/MM/YYYY')}} — {{title}}   ·   https://eagleeye.digital/blog/{{slug}}/"
    sortable_fields: [date, title]
    # Regroupe la liste par statut (brouillon / publié).
    view_groups:
      - label: "Statut"
        field: draft
    # Boutons de filtre en haut de la liste.
    view_filters:
      - label: "Publiés"
        field: draft
        pattern: false
      - label: "Brouillons"
        field: draft
        pattern: true
    fields:
      - name: draft
        label: "Brouillon (ne pas publier)"
        widget: boolean
        default: true
        required: false
        hint: "Coché = l'article reste en brouillon, invisible sur le site. Décochez puis Enregistrer pour le publier."

      - name: title
        label: "Titre (sert de H1 et de balise <title>)"
        widget: string
        hint: "Pour choisir où le titre passe à la ligne, insérez « // » à l'endroit de la coupure (ex. « Titre LinkedIn : // 15 exemples pour indépendants »). Le titre reste sur une seule ligne pour Google."

      - name: description
        label: "Description SEO (meta description, ~150 caractères)"
        widget: text
        hint: "Phrase d'accroche affichée dans Google sous le titre. Doit donner envie de cliquer."

      - name: date
        label: "Date de publication"
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: false
        hint: "Une date future = parution programmée : l'article se publiera tout seul à cette date (le site se reconstruit chaque jour). Laissez « Brouillon » décoché pour qu'il soit programmé."

      - name: keywords
        label: "Mots-clés SEO"
        label_singular: "Mot-clé"
        widget: list
        required: false
        default: []
        hint: "Le mot-clé principal en premier, puis 2-3 variantes."

      - name: pilier
        label: "Page pilier (maillage interne)"
        widget: select
        required: false
        hint: "La page offre/méthode vers laquelle cet article renvoie en fin d'article."
        options:
          - { label: "Formation LinkedIn", value: "/offres/formation-linkedin/" }
          - { label: "Accompagnement prospection", value: "/offres/accompagnement-prospection/" }
          - { label: "Méthode (webinaire / conversion)", value: "/methode/" }
          - { label: "Diagnostic LinkedIn", value: "/diagnostic-linkedin/" }
          - { label: "Campagnes multicanales", value: "/offres/campagnes-multicanales/" }
          - { label: "À propos / autorité", value: "/a-propos/" }

      - name: category
        label: "Catégorie"
        widget: select
        required: false
        hint: "Classe l'article sur la page Blog (filtres par thème). On choisit ensemble la bonne catégorie à chaque article."
        options:
          - "Profil LinkedIn"
          - "Prospection"
          - "Contenu & visibilité"
          - "Webinaire & conversion"
          - "Mesure & résultats"
          - "Multicanal & publicité"

      - name: titleBreak
        label: "Couper le titre après le premier « : » (affichage du H1 seulement)"
        widget: boolean
        default: false
        required: false

      - name: body
        label: "Contenu de l'article"
        widget: markdown
        hint: "Rédigez librement. Pensez au maillage : 2-3 liens vers des articles de la même grappe, et le lien vers la page pilier en fin d'article."

  - name: pages
    label: "Pages du site"
    label_singular: "Page"
    description: "Les pages fixes du site (hors articles de blog). Édition du texte uniquement."
    folder: "src/content/pages"
    create: false
    delete: false
    extension: md
    format: frontmatter
    identifier_field: h1
    summary: "{{h1}}   ·   https://eagleeye.digital/{{slug}}/"
    preview_path: "{{slug}}"
    fields:
      - { name: title, label: "Titre SEO (balise <title>)", widget: string }
      - name: description
        label: "Description SEO (meta)"
        widget: text
      - { name: eyebrow, label: "Surtitre (petit texte au-dessus du titre)", widget: string, required: false }
      - { name: h1, label: "Titre principal (H1)", widget: string }
      - { name: lede, label: "Accroche / chapô", widget: text, required: false }
      - { name: body, label: "Contenu de la page", widget: markdown }
